<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore — Магазин будущего</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container header-flex">
            <a href="/" class="logo">TechStore</a> <!-- Теперь это ссылка на корень сайта -->
            
            <nav class="nav">
                <a href="#catalog">Каталог</a>
                <a href="#contacts">Контакты</a>
                <div class="cart-icon" id="cart-btn">
                    🛒 <span id="cart-count">0</span>
                </div>
            </nav>
            
            <button id="theme-toggle" class="btn-toggle">🌓 Тема</button>
        </div>
        
        <div id="cart-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Ваша корзина</h2>
                <div id="cart-items">
                </div>
                <hr>
                <div class="cart-total">Итого: <span id="total-price">0</span> ₽</div>
                <button class="cta-button" onclick="alert('Заказ оформлен!')">Оформить заказ</button>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>Инновации в каждом гаджете</h1>
            <p>Покупайте и создавайте эффект богатства вместе с нами!</p>
            <a href="#catalog" class="cta-button">Смотреть товары</a>
        </section>

        <section id="catalog" class="container">
            <h2 class="section-title">Каталог товаров</h2>
            <div class="product-grid" id="product-container">
            </div>
            <div class="center">
                <button id="load-more" class="btn-secondary">Показать еще</button>
            </div>
        </section>

        <section id="contacts" class="container">
            <div class="form-wrapper">
                <h2 class="section-title">Есть вопросы?</h2>
                <form id="feedback-form" class="form">
                    <input type="text" name="user_name" placeholder="Ваше имя" required>
                    <input type="email" name="user_email" placeholder="Ваш Email" required>
                    <textarea name="user_message" placeholder="Напишите что бы вы хотели, чтобы мы добавили на сайт или задайте свой вопрос?" required></textarea>
                    <button type="submit" class="cta-button">Отправить заявку</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 TechStore Project. Сделано для итогового задания.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
